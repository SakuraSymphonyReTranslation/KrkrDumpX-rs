name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Run tests
        run: cargo test --locked

      - name: Build Windows x64 release
        run: cargo build --release --locked

      - name: Build Windows x86 release
        run: cargo build --release --locked --target i686-pc-windows-msvc

      - name: Package release artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist/win64, dist/win32 | Out-Null

          Copy-Item target/release/krkrdumpx-rs.exe dist/krkrdumpx-rs-win64.exe
          Copy-Item target/release/krkrdumpx-rs.exe dist/win64/krkrdumpx-rs.exe
          Copy-Item README.md, LICENSE dist/win64/
          Compress-Archive -Path dist/win64/* -DestinationPath "dist/krkrdumpx-rs-$tag-win64.zip" -Force

          Copy-Item target/i686-pc-windows-msvc/release/krkrdumpx-rs.exe dist/krkrdumpx-rs-win32.exe
          Copy-Item target/i686-pc-windows-msvc/release/krkrdumpx-rs.exe dist/win32/krkrdumpx-rs.exe
          Copy-Item README.md, LICENSE dist/win32/
          Compress-Archive -Path dist/win32/* -DestinationPath "dist/krkrdumpx-rs-$tag-win32.zip" -Force

          Get-FileHash dist/krkrdumpx-rs-win64.exe, dist/krkrdumpx-rs-win32.exe, "dist/krkrdumpx-rs-$tag-win64.zip", "dist/krkrdumpx-rs-$tag-win32.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding utf8 dist/SHA256SUMS.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" `
            "dist/krkrdumpx-rs-win64.exe" `
            "dist/krkrdumpx-rs-win32.exe" `
            "dist/krkrdumpx-rs-$tag-win64.zip" `
            "dist/krkrdumpx-rs-$tag-win32.zip" `
            "dist/SHA256SUMS.txt" `
            --title "KrkrDumpX-rs $tag" `
            --generate-notes
