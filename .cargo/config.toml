# Pure-Rust static key derivation works natively on 64-bit and cross-platform targets.
# If building for 32-bit Windows x86 (enables optional bootstrap.dll LoadLibrary fallback),
# enable /LARGEADDRESSAWARE for 4 GB virtual address space on 64-bit Windows.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-arg=/LARGEADDRESSAWARE"]
