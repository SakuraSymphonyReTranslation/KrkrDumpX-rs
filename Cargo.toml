[package]
name = "krkrdumpx-rs"
version = "0.1.0"
edition = "2024"
description = "Static Kirikiri XP3 / Cxdec Hxv4 key extractor, analyzer, auto-unhasher, and archive extractor"
license = "GPL-3.0-or-later"
repository = "https://github.com/alyappy/KrkrDumpX-rs"

[dependencies]
anyhow = "1"
blake2 = "0.10"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
indicatif = "0.17"
lz4_flex = "0.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
